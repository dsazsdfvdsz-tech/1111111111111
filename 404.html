<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, follow" />
<title>404 — Page not found | Salman</title>
<meta name="description" content="That page doesn't exist. Head back to the homepage." />
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500&display=swap" />
<style>
  :root{--bg:#f7f3ec;--ink:#2b2a27;--muted:#6e665a;--caramel:#b8865b;--rule:#ece4d3;--card:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{min-height:100vh;display:grid;place-items:center;padding:2rem}
  .wrap{text-align:center;max-width:520px}
  .code{font-family:'Fraunces',serif;font-size:clamp(80px,18vw,160px);line-height:1;letter-spacing:-.04em;font-weight:500;color:var(--ink)}
  .code em{font-style:italic;color:var(--caramel)}
  h1{font-family:'Fraunces',serif;font-size:clamp(22px,3.5vw,30px);letter-spacing:-.02em;margin:1rem 0 .75rem;font-weight:500}
  p{color:var(--muted);font-size:15px;line-height:1.65;margin:0 0 2rem}
  a.btn{display:inline-flex;align-items:center;gap:.5rem;min-height:48px;padding:0 1.4rem;background:var(--ink);color:#fff;border-radius:999px;text-decoration:none;font-size:14px;font-weight:500;transition:background .3s ease,transform .3s ease}
  a.btn:hover{background:var(--caramel);transform:translateY(-1px)}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="code">4<em>0</em>4</div>
    <h1>This page wandered off.</h1>
    <p>The link is broken or the page has moved. Head back to the homepage and try again.</p>
    <a class="btn" href="/">← Back to home</a>
  </div>
</main>
</body>
</html>
